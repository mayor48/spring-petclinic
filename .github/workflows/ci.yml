name: Unit Tests

on:
  push:
    branches: [main]


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode test

      - name: Generate HTML report
        if: always()
        run: ./mvnw --batch-mode surefire-report:report-only

      - name: Configure AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
          
      - name: Show report files
        if: always()
        run: find target -iname "surefire*" -not -path "*/classes/*" 

      - name: Publish report to S3
        if: always()
        run: |
          DEST=s3://unit-test-report-steve/unit-tests/${{ github.run_id }}
          aws s3 sync target/surefire-reports $DEST/xml
          aws s3 cp target/reports/surefire.html $DEST/index.html